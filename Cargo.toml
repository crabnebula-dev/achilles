[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["CrabNebula Ltd. <hello@crabnebula.dev>"]
repository = "https://github.com/crabnebula-dev/achilles"

[workspace.dependencies]
# shared detection deps
aho-corasick = "1.1"
memchr = "2.7"
memmap2 = "0.9"
plist = "1.7"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# async + HTTP + hashing for scan / cve / audit crates
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs", "net", "signal"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
semver = "1"
dirs = "6"
# cross-platform binary parsing: ELF (Linux) + PE (Windows) headers, imports,
# program headers for the audit + detection layers
goblin = "0.9"
# PE version resources + DllCharacteristics + embedded manifests (Windows).
# `mmap` (the default) pulls in libc/winapi, so it's opt-in per target: on by
# default nowhere, added back by the Windows build, left off for wasm.
pelite = { version = "0.10", default-features = false, features = ["derive_pod"] }
# Windows registry access (system webview, autostart, native-messaging hosts)
winreg = "0.52"
# Parse the embedded Authenticode PKCS#7 to read the signer certificate
cms = "0.2"
x509-cert = "0.2"
# Win32 APIs: Authenticode trust verification (WinVerifyTrust) and resolving
# Start Menu / Startup `.lnk` shortcuts via the Shell COM API (IShellLinkW).
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
] }
# netmon: passive TLS-handshake parsing + packet capture for the network monitor
tls-parser = "0.12"
etherparse = "0.16"
md-5 = "0.10"
async-trait = "0.1"
tokio-util = "0.7"
pcap = "2"
sysinfo = "0.32"
# rust-audit: extract cargo-auditable dependency data from binaries + parse the
# RustSec advisory-db.
auditable-extract = "0.3"
# `rust_backend` (miniz_oxide) is flate2's default; pinned explicitly because
# the C backends can't link on wasm, where `pkg` needs it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
toml = "0.8"
# `pkg`: the decompressors behind the Linux package formats. All pure Rust, so
# the readers compile into the wasm bundle (a C backend has no libc to link
# against there) as well as the desktop build.
lzma-rs = "0.3"
ruzstd = "0.9"
lz4_flex = { version = "0.14", default-features = false, features = [
    "std",
    "safe-decode",
    "checked-decode",
    "frame",
] }
bzip2-rs = "0.1"
# data-parallelism for the static-scan corpus loop
rayon = "1.10"
# wasm / browser entry point (the `achilles-wasm` crate); pinned centrally so
# every wasm-binding dependency (incl. reqwest's wasm backend) resolves to one
# `wasm-bindgen` version.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# JS / TS AST parsing for the static-scan rules
oxc_allocator = "0.126"
oxc_ast = "0.126"
oxc_ast_visit = "0.126"
oxc_parser = "0.126"
oxc_span = "0.126"
# internal crates referenced across the workspace
vfs = { path = "crates/vfs" }
detect = { path = "crates/detect" }
scan = { path = "crates/scan" }
cve = { path = "crates/cve" }
app-audit = { path = "crates/app-audit" }
static-scan = { path = "crates/static-scan" }
sideeffects = { path = "crates/sideeffects" }
cbom = { path = "crates/cbom" }
netmon = { path = "crates/netmon" }
rust-audit = { path = "crates/rust-audit" }
binmeta = { path = "crates/binmeta" }
pkg = { path = "crates/pkg" }
