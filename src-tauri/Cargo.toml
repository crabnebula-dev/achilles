[package]
name = "achilles"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Achilles — scan installed apps for Electron/Tauri/etc. runtime risk."

[lib]
name = "achilles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.3", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.4", features = ["tray-icon"] }
tauri-runtime-wry = "3.0.0-alpha.4"
tauri-plugin-shell = "3.0.0-alpha.2"
tauri-plugin-updater = "3.0.0-alpha.2"
tauri-plugin-process = "3.0.0-alpha.2"
tauri-plugin-dialog = "3.0.0-alpha.3"
tauri-plugin-fs = "3.0.0-alpha.2"
tauri-plugin-autostart = "3.0.0-alpha.2"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
uuid = { version = "1", features = ["v4"] }
whoami = "1"
detect.workspace = true
scan.workspace = true
cve.workspace = true
app-audit.workspace = true
static-scan.workspace = true
sideeffects.workspace = true
netmon.workspace = true
cbom.workspace = true
rust-audit.workspace = true
binmeta.workspace = true
sysinfo.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Register/approve the privileged capture helper via SMAppService.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
